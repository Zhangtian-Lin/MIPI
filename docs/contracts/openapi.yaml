openapi: 3.1.0
info:
  title: MIPI API
  version: 1.0.0-draft
servers:
  - url: /v1
paths:
  /changes:
    get:
      operationId: listChanges
      parameters:
        - name: cursor
          in: query
          schema: { type: string }
        - name: industry
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Important changes
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/ChangeCard' } }
                  meta: { $ref: '#/components/schemas/Meta' }
  /events/{eventId}:
    get:
      operationId: getEvent
      parameters:
        - name: eventId
          in: path
          required: true
          schema: { type: string, pattern: '^EVT-' }
      responses:
        '200': { description: Event detail }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  schemas:
    ChangeCard:
      type: object
      required: [event_id, title, event_date, fact_level, independent_source_count]
      properties:
        event_id: { type: string }
        title: { type: string }
        event_date: { type: string, format: date }
        fact_level: { enum: [F0, F1, F2, F3, F4] }
        independent_source_count: { type: integer, minimum: 0 }
        conflict: { type: boolean }
    Meta:
      type: object
      required: [request_id, contract_version]
      properties:
        request_id: { type: string }
        contract_version: { type: string }
    Error:
      type: object
      required: [code, message, request_id, retryable]
      properties:
        code: { type: string }
        message: { type: string }
        request_id: { type: string }
        retryable: { type: boolean }
  responses:
    NotFound:
      description: Resource not found

