[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "mipi-backend"
version = "0.1.0"
description = "MIPI modular backend and processing pipeline"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.140.12,<1",
  "minio>=7.2,<8",
  "pydantic-settings>=2.10,<3",
  "psycopg[binary]>=3.2,<4",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.35,<1"
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1"
]

[tool.hatch.build.targets.wheel]
packages = ["backend/mipi"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["apps/api/tests", "tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["mipi"]
