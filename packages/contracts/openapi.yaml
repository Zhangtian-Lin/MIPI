openapi: 3.1.0
info:
  title: MIPI API
  version: 0.2.0
servers:
  - url: /v1
paths:
  /trade/overview:
    get:
      operationId: getTradeOverview
      description: Return only the current human-published L4 trade projection, or null.
      responses:
        '200':
          description: Current published trade overview or an empty data field
  /admin/trade-indicators/workbench:
    get:
      operationId: getTradeWorkbench
      description: List approved official L2 trade ingestions and private L3 batch readiness for authorized operators.
      parameters:
        - name: X-Actor-ID
          in: header
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
        - name: X-Actor-Role
          in: header
          required: true
          schema: { enum: [processing_agent, publisher, system_admin] }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
      responses:
        '200': { description: Eligible L2 records and L3 publication-readiness summaries }
        '503': { description: Operator identity provider is not configured }
  /admin/trade-indicators/project:
    post:
      operationId: projectTradeIndicators
      description: Normalize one approved L2 data.gov.my ingestion into a private L3 batch.
      parameters:
        - name: X-Actor-ID
          in: header
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
        - name: X-Actor-Role
          in: header
          required: true
          schema: { enum: [processing_agent, system_admin] }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TradeProjectionRequest' }
      responses:
        '200': { description: Private L3 trade batch created or returned idempotently }
        '409': { description: L2 review is incomplete }
        '422': { description: Dataset or official field contract is invalid }
  /admin/trade-indicators/{batchId}/publish:
    post:
      operationId: publishTradeIndicators
      description: Human Publisher creates a versioned L4 projection from a complete F4 batch.
      parameters:
        - name: batchId
          in: path
          required: true
          schema: { type: string, pattern: '^TIB-' }
        - name: X-Actor-ID
          in: header
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
        - name: X-Actor-Role
          in: header
          required: true
          schema: { const: publisher }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 8, maxLength: 500 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TradePublicationRequest' }
      responses:
        '200': { description: Published trade overview }
        '409': { description: Publication conflict or reused idempotency key }
        '422': { description: Batch is incomplete or not publication-ready }
  /changes:
    get:
      operationId: listChanges
      description: List at most ten current human-published L4 events.
      responses:
        '200': { description: Important changes }
  /events/{eventId}:
    get:
      operationId: getEvent
      parameters:
        - name: eventId
          in: path
          required: true
          schema: { type: string, pattern: '^EVT-' }
      responses:
        '200': { description: Event detail }
        '404': { description: Event not found }
  /admin/events/workbench:
    get:
      operationId: getEventWorkbench
      description: List approved L2 documents and private L3 event publication readiness.
      responses:
        '200': { description: Event processing workbench }
        '503': { description: Operator identity provider is not configured }
  /admin/events/ingestions/{ingestionId}/source:
    get:
      operationId: getEventSource
      description: Read preserved L2 text for exact source-span selection.
      parameters:
        - name: ingestionId
          in: path
          required: true
          schema: { type: string, pattern: '^ING-' }
      responses:
        '200': { description: Approved preserved source text }
  /admin/events/project:
    post:
      operationId: projectEvent
      description: Create one private F1 L3 event and claim from an approved L2 exact source span.
      responses:
        '200': { description: Private event created idempotently }
        '409': { description: L2 or idempotency conflict }
        '422': { description: Projection or source span is invalid }
  /admin/events/{eventId}/publish:
    post:
      operationId: publishEvent
      description: Human Publisher creates an immutable public L4 event revision.
      parameters:
        - name: eventId
          in: path
          required: true
          schema: { type: string, pattern: '^EVT-' }
      responses:
        '200': { description: Published event revision }
        '409': { description: Publication conflict }
        '422': { description: Event is not publication-ready }
  /ingestion/records:
    post:
      operationId: submitIngestionRecord
      description: Store an L0-L2 record and route it to review; this endpoint cannot publish.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IngestionEnvelope' }
      responses:
        '200': { description: Stored or idempotent duplicate }
        '404': { description: Source not registered }
        '409': { description: Idempotency key conflict }
        '422': { description: Contract or hash validation failed }
  /admin/sources:
    get:
      operationId: listSources
      responses:
        '200': { description: Registered source candidates }
    post:
      operationId: registerSource
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SourceRegistration' }
      responses:
        '200': { description: Source registered or idempotent duplicate }
        '409': { description: Existing source differs }
  /admin/sources/{sourceId}/decisions:
    post:
      operationId: decideSourceLifecycle
      description: Record a source-admin lifecycle decision; this does not change the S grade.
      parameters:
        - name: sourceId
          in: path
          required: true
          schema: { type: string, pattern: '^SRC-' }
        - name: X-Actor-ID
          in: header
          required: true
          schema: { type: string, minLength: 1 }
        - name: X-Actor-Role
          in: header
          required: true
          schema: { enum: [source_admin, system_admin] }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 8, maxLength: 500 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SourceDecision' }
      responses:
        '200': { description: Source lifecycle decision recorded }
        '404': { description: Source not found }
        '409': { description: Invalid lifecycle transition }
        '422': { description: Required checks or evidence are missing }
  /admin/ingestion-records:
    get:
      operationId: listIngestionCandidates
      parameters:
        - name: status
          in: query
          schema: { enum: [needs_review, quarantined] }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 50 }
      responses:
        '200': { description: L2 review candidates }
  /admin/ingestion-records/{ingestionId}:
    get:
      operationId: getIngestionCandidate
      parameters:
        - name: ingestionId
          in: path
          required: true
          schema: { type: string, pattern: '^ING-' }
      responses:
        '200': { description: Candidate detail }
        '404': { description: Candidate not found }
  /admin/review-tasks/{reviewTaskId}/decisions:
    post:
      operationId: decideReviewTask
      description: Record one human decision; risk gates determine whether review completes.
      parameters:
        - name: reviewTaskId
          in: path
          required: true
          schema: { type: string, pattern: '^REV-' }
        - name: X-Actor-ID
          in: header
          required: true
          schema: { type: string, minLength: 1 }
        - name: X-Actor-Role
          in: header
          required: true
          schema: { $ref: '#/components/schemas/ReviewActorRole' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewDecision' }
      responses:
        '200': { description: Decision recorded; response states whether the gate completed }
        '403': { description: Role cannot perform this decision }
        '404': { description: Review task not found }
        '409': { description: Task completed or actor already decided }
        '422': { description: Invalid decision or missing reason/limitations }
components:
  schemas:
    TradeOverview:
      $ref: './schemas/trade-overview.schema.json'
    TradeProjectionRequest:
      type: object
      additionalProperties: false
      required: [ingestion_id]
      properties:
        ingestion_id: { type: string, pattern: '^ING-' }
        rule_version: { type: string, default: trade-sitc-v1.0, maxLength: 100 }
    TradePublicationRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 8, maxLength: 2000 }
        rule_version: { type: string, default: trade-publication-v1.0, maxLength: 100 }
    IngestionEnvelope:
      $ref: './schemas/ingestion-envelope.schema.json'
    SourceRegistration:
      type: object
      additionalProperties: false
      required: [source_id, name, owner, base_url, source_grade, authority_scope, languages]
      properties:
        source_id: { type: string, pattern: '^SRC-' }
        name: { type: string, minLength: 1 }
        owner: { type: string, minLength: 1 }
        base_url: { type: string, format: uri }
        source_grade: { enum: [S1, S2, S3, S4, S5, S6] }
        authority_scope: { type: array, minItems: 1, items: { type: string } }
        languages: { type: array, minItems: 1, items: { type: string } }
    SourceDecision:
      type: object
      additionalProperties: false
      required: [action, reason]
      properties:
        action: { enum: [approve_for_trial, activate, degrade, deactivate, retire] }
        reason: { type: string, minLength: 8, maxLength: 2000 }
        rule_version: { type: string, default: source-review-v1.0 }
        identity_verified: { type: boolean, default: false }
        terms_reviewed: { type: boolean, default: false }
        authority_scope_reviewed: { type: boolean, default: false }
        robots_status: { enum: [unknown, allowed, limited, disallowed, not_applicable, null] }
        evidence_urls:
          type: array
          maxItems: 20
          items: { type: string, format: uri, pattern: '^https?://' }
        access_notes: { type: [string, 'null'], maxLength: 2000 }
    ReviewActorRole:
      enum: [reviewer, senior_reviewer, publisher, security_compliance]
    ReviewDecision:
      type: object
      additionalProperties: false
      required: [action, reason]
      properties:
        action:
          enum: [approve, approve_with_limits, return_for_fix, reject, quarantine]
        reason: { type: string, minLength: 8, maxLength: 2000 }
        rule_version: { type: string, default: review-v1.0 }
        limitations:
          type: array
          maxItems: 20
          items: { type: string, minLength: 1, maxLength: 500 }
